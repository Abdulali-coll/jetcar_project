version: '3'
services:
  postgres:
    image: postgres:15
    container_name: pg-jetcar
    environment:
      POSTGRES_DB: jetcardb
      POSTGRES_USER: jetcaruser
      POSTGRES_PASSWORD: secret123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
